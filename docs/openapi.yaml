openapi: 3.0.3
info:
  title: Warhammer AI Store API
  version: 1.0.0
  description: Каталог, корзина, заказы и интеллектуальный подбор товаров.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: v1_cart_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCart'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/v1/cart/items/{item_id}/:
    patch:
      operationId: v1_cart_items_partial_update
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuantity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuantity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuantity'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    delete:
      operationId: v1_cart_items_destroy
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/factions/:
    get:
      operationId: v1_factions_list
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faction'
          description: ''
    post:
      operationId: v1_factions_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Faction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Faction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Faction'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
          description: ''
  /api/v1/factions/{id}/:
    get:
      operationId: v1_factions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faction.
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
          description: ''
    put:
      operationId: v1_factions_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faction.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Faction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Faction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Faction'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
          description: ''
    patch:
      operationId: v1_factions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faction.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFaction'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
          description: ''
    delete:
      operationId: v1_factions_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faction.
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/orders/:
    get:
      operationId: v1_orders_list
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
    post:
      operationId: v1_orders_create
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{order_id}/:
    get:
      operationId: v1_orders_retrieve
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/products/:
    get:
      operationId: v1_products_list
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: v1_products_create
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: v1_products_retrieve
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: v1_products_update
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: v1_products_partial_update
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: v1_products_destroy
      parameters:
      - in: query
        name: faction
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/recommendations/:
    post:
      operationId: v1_recommendations_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
          description: ''
components:
  schemas:
    AddToCart:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 999
          minimum: 1
          default: 1
      required:
      - product_id
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          readOnly: true
        total_quantity:
          type: integer
          readOnly: true
      required:
      - id
      - items
      - total_price
      - total_quantity
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - product
      - total_price
    Faction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        logo:
          type: string
          format: uri
      required:
      - description
      - id
      - name
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          maxLength: 20
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total_price
    OrderItem:
      type: object
      properties:
        product:
          type: integer
          nullable: true
        product_name:
          type: string
          maxLength: 200
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - product_name
      - quantity
      - total_price
      - unit_price
    PatchedFaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        logo:
          type: string
          format: uri
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        faction:
          allOf:
          - $ref: '#/components/schemas/Faction'
          readOnly: true
        faction_id:
          type: integer
          writeOnly: true
          nullable: true
        product_type:
          $ref: '#/components/schemas/ProductTypeEnum'
        category_label:
          type: string
          readOnly: true
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discounted_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: uri
        tags:
          type: string
          maxLength: 300
        beginner_friendly:
          type: boolean
        image_source:
          type: string
          format: uri
          maxLength: 500
    PatchedQuantity:
      type: object
      properties:
        quantity:
          type: integer
          maximum: 999
          minimum: 1
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        faction:
          allOf:
          - $ref: '#/components/schemas/Faction'
          readOnly: true
        faction_id:
          type: integer
          writeOnly: true
          nullable: true
        product_type:
          $ref: '#/components/schemas/ProductTypeEnum'
        category_label:
          type: string
          readOnly: true
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discounted_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: uri
        tags:
          type: string
          maxLength: 300
        beginner_friendly:
          type: boolean
        image_source:
          type: string
          format: uri
          maxLength: 500
      required:
      - category_label
      - description
      - discounted_price
      - faction
      - id
      - name
      - price
      - product_type
    ProductTypeEnum:
      enum:
      - MINIATURE
      - STARTER_SET
      - PAINT
      - ACCESSORY
      - BOOK
      type: string
      description: |-
        * `MINIATURE` - Миниатюры
        * `STARTER_SET` - Стартовые наборы
        * `PAINT` - Краски
        * `ACCESSORY` - Аксессуары
        * `BOOK` - Книги правил
    RecommendationItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
        reason:
          type: string
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - product
      - quantity
      - reason
      - total_price
    RecommendationRequest:
      type: object
      properties:
        preferences:
          type: string
          maxLength: 1200
          minLength: 5
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        faction:
          type: integer
          minimum: 1
          nullable: true
        product_type:
          $ref: '#/components/schemas/ProductTypeEnum'
        max_items:
          type: integer
          maximum: 5
          minimum: 1
          default: 3
      required:
      - budget
      - preferences
    RecommendationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        explanation:
          type: string
        model:
          type: string
        cached:
          type: boolean
      required:
      - budget
      - cached
      - explanation
      - items
      - model
      - total_price
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        is_staff:
          type: boolean
      required:
      - id
      - is_staff
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
